[package]
name = "ryclop"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Ultra-lightweight, zero-dependency POSIX wrapper for Linux/Unix package managers"
readme = "README.md"
license = "GPL-3.0-only"
repository = "https://github.com/SrDicov/ryclop"
categories = ["command-line-utilities", "os::unix-apis"]
keywords = ["package-manager", "linux", "posix", "xbps", "pacman"]

[[bin]]
name = "ryclop"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# BeautifulRust lints (https://github.com/morganlinton/BeautifulRust), application flavour:
# the [lib]-only lints (missing_docs, missing_errors_doc, missing_panics_doc,
# print_stdout, print_stderr) are intentionally absent because this is a CLI binary.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"

string_add = "warn"
wildcard_imports = "warn"

dbg_macro = "warn"
todo = "warn"

as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
