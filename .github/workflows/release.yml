name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  build:
    name: Static musl (${{ matrix.arch }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: i686
            target: i686-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
          - arch: armv7
            target: armv7-unknown-linux-musleabihf
          - arch: riscv64
            target: riscv64gc-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Build static musl binary
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Verify static linking
        run: |
          BIN="target/${{ matrix.target }}/release/ryclop"
          file "$BIN"
          if ldd "$BIN" 2>&1 | grep -q '=>'; then
            echo "error: $BIN is dynamically linked" >&2
            exit 1
          fi

      - name: Package binary + ryp symlink
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="v0.0.1"; fi
          STAGE="ryclop-${TAG}-${{ matrix.arch }}-linux-musl"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/ryclop" "$STAGE/ryclop"
          chmod 755 "$STAGE/ryclop"
          ln -s ryclop "$STAGE/ryp"
          cp README.md LICENSE "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          cp "target/${{ matrix.target }}/release/ryclop" "ryclop-${{ matrix.arch }}-linux-musl"
          sha256sum "${STAGE}.tar.gz" "ryclop-${{ matrix.arch }}-linux-musl" \
            > "SHA256SUMS-${{ matrix.arch }}.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            ryclop-*.tar.gz
            ryclop-${{ matrix.arch }}-linux-musl
            SHA256SUMS-*.txt

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Consolidate SHA256SUMS
        run: |
          cd dist
          cat SHA256SUMS-*.txt > SHA256SUMS
          rm -f SHA256SUMS-*.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "ryclop ${GITHUB_REF_NAME}" \
            --generate-notes
